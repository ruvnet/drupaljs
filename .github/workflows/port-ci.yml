name: port-ci

# CI for the TypeScript/Rust-WASM port (ADR-0014/0015/0016/0017).
# Runs only when the port subtree (or this workflow) changes.
on:
  push:
    paths:
      - 'port/**'
      - '.github/workflows/port-ci.yml'
  pull_request:
    paths:
      - 'port/**'
      - '.github/workflows/port-ci.yml'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: port-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (node 20 + rust stable + wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: port
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: port/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: port

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npx tsc -b

      - name: Vitest (with coverage)
        run: npx vitest run --coverage

      - name: Cargo test (workspace)
        run: cargo test --workspace

      - name: Build WASM
        run: npm run wasm

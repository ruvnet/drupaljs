[package]
name = "drupaljs-crypt"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
getrandom = "0.2"

# On the wasm32 target `getrandom` needs the `js` feature so `randomBytesBase64`
# can reach the browser/Node CSPRNG. Native builds use the OS RNG directly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Rust workspace for Drupal.js complex-algorithm crates compiled to WASM.
# Each crate under crates/* is a wasm-bindgen library consumed by a TS package.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/ruvnet/drupaljs"

[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
